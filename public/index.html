<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alumni Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f9;--pn:#fff;--ink:#0f1a33;--mut:#5d6b85;--ln:#e2e7f1;--ac:#f26b1d;--on:#0f1a33;--tl:#0f766e;--rail:#0f1a33;--rt:#b9c4de;--tint:#fff3ea}
@media(prefers-color-scheme:dark){:root{--bg:#0a1120;--pn:#111b32;--ink:#e8edf8;--mut:#93a1bd;--ln:#223052;--ac:#ff8a3d;--tl:#4fd1c5;--rail:#060b17;--tint:#2a1c14}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "DM Sans",system-ui,"Segoe UI",sans-serif;display:grid;grid-template-columns:232px 1fr;min-height:100vh}
h1,h2,h3{font-family:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;margin:0;letter-spacing:-.01em}h3{font-size:18px;margin-bottom:12px}
.rail{background:var(--rail);color:var(--rt);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font:700 19px "Bricolage Grotesque",sans-serif;margin:0 8px 18px}
.mark{width:34px;height:34px;border-radius:10px;background:var(--ac);color:#0f1a33;display:grid;place-items:center;font:800 14px "Bricolage Grotesque",sans-serif}
.nv{display:flex;align-items:center;gap:11px;background:none;border:0;color:var(--rt);padding:9px 12px;border-radius:9px;text-align:left;cursor:pointer;font:500 14.5px "DM Sans",sans-serif}
.nv svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.nv:hover{background:#ffffff14;color:#fff}.nv.on{background:var(--ac);color:#0f1a33;font-weight:700}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 8px;border-top:1px solid #ffffff22;color:#fff}.me small{display:block;color:var(--rt)}.me b{font-size:14px}.me .lo{margin-left:auto;background:none;border:1px solid #ffffff44;color:#fff;border-radius:8px;padding:4px 9px;cursor:pointer;font:inherit;font-size:12.5px}
main{padding:30px 36px 60px;max-width:1040px;width:100%}.ph{margin-bottom:20px}.ph h1{font-size:32px}.ph p{margin:2px 0 0;color:var(--mut)}
body:not(.in){display:block}body:not(.in) .rail,body:not(.in) .ph{display:none}body:not(.in) main{padding:0;max-width:none}
.panel{background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:22px;margin-bottom:18px}.cols{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}.cols .panel{margin:0}.cols{margin-bottom:18px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.grow{flex:1;min-width:0}.m{color:var(--mut);font-size:13.5px}
.f{display:block;margin-bottom:10px}.f span{display:block;font-size:13px;color:var(--mut);margin-bottom:3px;font-weight:500}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:9px 12px}input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:1px}
.btn{background:var(--ac);color:#0f1a33;border:0;border-radius:10px;padding:9px 18px;font:700 14px "DM Sans",sans-serif;cursor:pointer}.btn:hover{filter:brightness(1.07)}.btn:focus-visible,.nv:focus-visible{outline:2px solid var(--tl);outline-offset:2px}
.btn.g{background:transparent;color:var(--ink);border:1px solid var(--ln)}.btn.s{padding:5px 12px;font-size:13px}
.item{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--ln)}h3+.item,.item:first-of-type{border-top:0}.item b{display:block}
.av{width:38px;height:38px;border-radius:50%;background:hsl(var(--h) 50% 38%);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.pill{display:inline-block;padding:2px 11px;border-radius:99px;font-size:12.5px;font-weight:700;color:var(--mut);background:color-mix(in srgb,currentColor 13%,transparent)}
.pill.accepted,.pill.referred,.pill.interview{color:var(--tl)}.pill.selected{color:#16a34a}.pill.declined{color:#dc2626}.pill.pending,.pill.requested{color:#b45309}
.tag{display:inline-block;background:var(--tint);color:var(--ink);border-radius:6px;padding:0 8px;font-size:12px;margin:2px 4px 0 0}
.rk{width:24px;font:700 17px "Bricolage Grotesque",sans-serif;color:var(--ac)}.pp{font:700 17px "Bricolage Grotesque",sans-serif}.cnt{font:500 14px "DM Sans",system-ui,sans-serif;color:var(--mut)}
.hero2{display:flex;justify-content:space-between;align-items:center;background:var(--rail);color:#fff;border-radius:18px;padding:26px 30px;margin-bottom:18px}
.hero2 h2{font-size:40px}.hero2 .m{color:var(--rt)}.pts{text-align:center;background:var(--ac);color:#0f1a33;border-radius:16px;padding:12px 24px}.pts b{display:block;font:800 34px "Bricolage Grotesque",system-ui,sans-serif}
.empty{color:var(--mut);margin:6px 0;padding:14px;border:1px dashed var(--ln);border-radius:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px}.stat{background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:18px}.stat b{display:block;font:800 34px "Bricolage Grotesque",system-ui,sans-serif;color:var(--ac)}
.bar{height:8px;border-radius:4px;background:var(--tl);margin:3px 0 10px}.bar2{display:flex;gap:12px;align-items:flex-end}.bar2 .f{flex:1}
.bub{max-width:75%;padding:8px 13px;border-radius:14px;margin:5px 0;background:var(--bg)}.bub.me2{margin-left:auto;background:var(--ac);color:#0f1a33}.chat{height:300px;overflow:auto;padding:6px}
.date{width:54px;text-align:center;border:1px solid var(--ln);border-radius:12px;padding:4px 0;flex:none}.date b{font:800 21px "Bricolage Grotesque",system-ui,sans-serif;line-height:1.1}.date span{font-size:11.5px;color:var(--ac);font-weight:700}
.code{font-family:Consolas,monospace;background:var(--tint);padding:3px 9px;border-radius:6px}.tip{background:var(--tint);border-radius:10px;padding:8px 12px;margin-top:8px;font-size:14px}
#msg{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:99px;display:none;z-index:9}
.auth{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}.hero{background:var(--rail);color:#fff;padding:60px 56px;display:flex;flex-direction:column;justify-content:center}
.hero h1{font-size:54px;line-height:1.02;margin:22px 0 16px}.hero .lead{font-size:20px;color:var(--rt);max-width:420px}.hero ul{padding:0;list-style:none;margin-top:30px;color:var(--rt)}.hero li{padding:8px 0 8px 18px;border-left:3px solid var(--ac);margin-bottom:8px}
.gate{padding:50px 8vw;display:flex;flex-direction:column;justify-content:center}.tabs{display:flex;gap:6px;margin-bottom:20px}.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);font:700 15px "DM Sans",system-ui,sans-serif;padding:8px 12px;cursor:pointer}.tabs button.on{color:var(--ink);border-color:var(--ac)}
@media(max-width:820px){body{display:block}.rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:10px}.brand{margin:0 10px 0 0}.me{width:100%;margin-top:6px}main{padding:18px}.cols,.auth,.g2{grid-template-columns:1fr}.hero{padding:36px 24px}.hero h1{font-size:38px}.gate{padding:30px 22px}}
</style></head><body>
<aside class="rail"><div class="brand"><span class="mark">AC</span>Alumni Connect</div><nav id="nav" style="display:contents"></nav><div class="me" id="me"></div></aside>
<main><div class="ph"><h1 id="h-t"></h1><p id="h-s"></p></div><div id="app"></div></main><div id="msg" role="status"></div>
<script>
let T=localStorage.t,U=null;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const e=$('#msg');e.textContent=m;e.style.display='block';clearTimeout(e.t);e.t=setTimeout(()=>e.style.display='none',3200)}
async function api(p,m='GET',b){const r=await fetch('/api'+p,{method:m,headers:{'Content-Type':'application/json',Authorization:'Bearer '+T},body:b?JSON.stringify(b):undefined});
 const j=await r.json().catch(()=>({}));if(!r.ok){toast(j.error||'Something went wrong');throw j}if(j.ok)toast(j.ok);return j}
const val=id=>$('#'+id)?.value||'',fld=(id,l,t='text',ph='')=>`<label class="f"><span>${l}</span><input id="${id}" type="${t}" placeholder="${ph}"></label>`;
const ini=n=>String(n||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(),av=n=>`<span class="av" style="--h:${[...String(n)].reduce((a,c)=>a+c.charCodeAt(0),0)*7%360}">${esc(ini(n))}</span>`;
const pill=s=>`<span class="pill ${String(s).toLowerCase()}">${esc(s)}</span>`,empty=t=>`<p class="empty">${t}</p>`,put=h=>$('#app').innerHTML=h;
const IC={Home:'M3 10.5 12 3l9 7.5V21H3z',Mentors:'M16 8a4 4 0 1 0-8 0 4 4 0 0 0 8 0zM4 21c0-4 3.6-6 8-6s8 2 8 6',Referrals:'M7 7h10v10M7 17 17 7','Interview library':'M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 19V5','Career paths':'M4 20V9M10 20V4M16 20v-8M22 20H2',Events:'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4',Chat:'M4 5h16v11H9l-5 4z',Giving:'M12 20s-7-4.5-7-10a4 4 0 0 1 7-2 4 4 0 0 1 7 2c0 5.5-7 10-7 10z',Resume:'M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h7',Admin:'M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z'};
const SUB={Home:'Your network at a glance',Mentors:'Find someone who has done what you want to do',Referrals:'Open jobs and where each request stands','Interview library':'Real interview rounds from your seniors','Career paths':'Where each branch’s graduates ended up',Events:'Reunions, talks and meetups',Chat:'Talk with your accepted mentor or mentee',Giving:'Support students from your college',Resume:'Get feedback and see which jobs fit you',Admin:'Approvals, events and outcome reports'};
function at(i){[0,1,2].forEach(k=>{$('#a'+k).hidden=k!==i;document.querySelectorAll('.tabs button')[k].classList.toggle('on',k===i)})}
function authView(){document.body.classList.remove('in');$('#h-t').textContent='';
put(`<div class="auth"><section class="hero"><span class="mark" style="width:46px;height:46px;font-size:18px">AC</span><h1>Your college network, verified.</h1><p class="lead">Only approved students and alumni get in. Ask for help and get real answers.</p><ul><li>Mentors matched to your goals and skills</li><li>Referrals tracked from request to offer</li><li>Interview experiences from your own seniors</li></ul></section>
<section class="gate"><div class="tabs"><button class="on" onclick="at(0)">Log in</button><button onclick="at(1)">Join</button><button onclick="at(2)">Verify email</button></div>
<div id="a0">${fld('le','Email','email')}${fld('lp','Password','password')}<button class="btn" onclick="login()">Log in</button></div>
<div id="a1" hidden><div class="g2">${fld('rn','Full name')}${fld('re','College email','email')}${fld('rp','Password','password')}<label class="f"><span>I am a</span><select id="rr"><option value="student">Student</option><option value="alumni">Alumnus / alumna</option></select></label>${fld('rb','Branch')}${fld('ry','Batch (graduation year)','number')}${fld('rc','Company (alumni)')}${fld('rt','Job title (alumni)')}${fld('rci','City')}${fld('rs','Skills, comma separated')}</div><button class="btn" onclick="reg()">Create account</button></div>
<div id="a2" hidden><p class="m">Enter the 6-digit OTP shown in the server console.</p>${fld('ve','Email','email')}${fld('vo','OTP')}<button class="btn" onclick="ver()">Verify email</button></div></section></div>`);at(0)}
async function login(){const j=await api('/login','POST',{email:val('le'),password:val('lp')});T=j.token;localStorage.t=T;boot()}
const reg=()=>api('/register','POST',{name:val('rn'),email:val('re'),password:val('rp'),role:val('rr'),branch:val('rb'),batch:val('ry'),company:val('rc'),title:val('rt'),city:val('rci'),skills:val('rs')}).then(()=>{at(2);$('#ve').value=val('re')});
const ver=()=>api('/verify','POST',{email:val('ve'),otp:val('vo')}).then(()=>{at(0);$('#le').value=val('ve')});
const TABS={Home:home,Mentors:mentors,Referrals:referrals,'Interview library':library,'Career paths':paths,Events:events,Chat:chat,Giving:giving,Resume:resume};
function logout(){localStorage.removeItem('t');T=null;U=null;boot()}
async function boot(){if(!T)return authView();try{U=await api('/me')}catch{return logout()}
 document.body.classList.add('in');const names=Object.keys(TABS);if(U.role==='admin')names.push('Admin');
 $('#nav').innerHTML=names.map(n=>`<button class="nv" data-n="${n}" onclick="go('${n}')"><svg viewBox="0 0 24 24"><path d="${IC[n]}"/></svg>${n}</button>`).join('');
 $('#me').innerHTML=`${av(U.name)}<div class="grow"><b>${esc(U.name.split(' ')[0])}</b><small>${U.role} · ${U.points} pts</small></div><button class="lo" onclick="logout()">Log out</button>`;go('Home')}
async function go(n){clearInterval(ct);document.querySelectorAll('.nv').forEach(b=>b.classList.toggle('on',b.dataset.n===n));$('#h-t').textContent=n;$('#h-s').textContent=SUB[n];put('');await(n==='Admin'?admin:TABS[n])()}
async function home(){const l=await api('/leaders'),d=await api('/directory');
put(`<section class="hero2"><div><p class="m">Welcome back</p><h2>${esc(U.name.split(' ')[0])}</h2><p class="m">${U.role==='alumni'?'A student is waiting for a mentor like you.':'Find a mentor and request your first referral.'}</p></div><div class="pts"><b>${U.points}</b>points</div></section>
<div class="cols"><section class="panel"><h3>Your profile</h3><div class="g2">${fld('pc','Company')}${fld('pt','Job title')}${fld('pci','City')}${fld('ps','Skills')}</div><button class="btn" onclick="saveP()">Save profile</button></section>
<section class="panel"><h3>Top contributors</h3>${l.map((x,i)=>`<div class="item"><span class="rk">${i+1}</span>${av(x.name)}<div class="grow"><b>${esc(x.name)}</b><span class="m">${x.role}</span></div><span class="pp">${x.points}</span></div>`).join('')||empty('No points yet. Be the first to help someone.')}</section></div>
<section class="panel"><h3>Alumni directory <span class="cnt">${d.length}</span></h3>${d.map(x=>`<div class="item">${av(x.name)}<div class="grow"><b>${esc(x.name)}</b><span class="m">${esc(x.title)}${x.company?' at '+esc(x.company):''}</span></div><span class="m">${esc(x.branch)} ’${String(x.batch||'').slice(-2)}</span><span class="m">${esc(x.city)}</span></div>`).join('')||empty('No alumni yet.')}</section>`);
 $('#pc').value=U.company;$('#pt').value=U.title;$('#pci').value=U.city;$('#ps').value=U.skills}
const saveP=()=>api('/me','PUT',{company:val('pc'),title:val('pt'),city:val('pci'),skills:val('ps'),bio:''});
async function mentors(){const mine=await api('/mentors/mine'),st=U.role==='student';
 put(`${st?`<section class="panel"><h3>Find a mentor</h3><p class="m">Describe what you want to learn. Alumni are ranked by shared skills, branch and batch.</p><div class="bar2">${fld('goal','Your goal','text','e.g. backend internship at Google')}<button class="btn" style="margin-bottom:10px" onclick="match()">Match me</button></div><div id="mm"></div></section>`:''}
<section class="panel"><h3>My mentorships</h3>${mine.map(m=>{const o=st?m.aname:m.sname;return`<div class="item">${av(o)}<div class="grow"><b>${esc(o)}</b><span class="m">${esc(m.goal)}</span></div>${pill(m.status)}${U.role==='alumni'&&m.status==='Pending'?`<button class="btn s" onclick="mAct(${m.id},'accept')">Accept</button><button class="btn s g" onclick="mAct(${m.id},'decline')">Decline</button>`:''}</div>`}).join('')||empty(st?'No mentorships yet. Use Match me to find your first mentor.':'No requests yet.')}</section>`)}
async function match(){const r=await api('/mentors/match?goal='+encodeURIComponent(val('goal')));$('#mm').innerHTML=r.map(a=>`<div class="item">${av(a.name)}<div class="grow"><b>${esc(a.name)}</b><span class="m">${esc(a.title)}${a.company?' at '+esc(a.company):''}</span><div>${a.why.map(w=>`<span class="tag">${esc(w)}</span>`).join('')}</div></div>${pill('Score '+a.score)}<button class="btn s" onclick="reqM(${a.id})">Request</button></div>`).join('')||empty('No matches. Add skills to your profile or widen your goal.')}
const reqM=id=>api('/mentors/request','POST',{mentor:id,goal:val('goal')}).then(mentors),mAct=(id,a)=>api(`/mentors/${id}/${a}`,'POST').then(mentors);
async function referrals(){const j=await api('/jobs'),r=await api('/referrals'),S=['Requested','Referred','Interview','Selected','Declined'];
 put(`${U.role==='alumni'?`<section class="panel"><h3>Post a job with referral slots</h3><div class="g2">${fld('jt','Role')}${fld('jc','Company')}${fld('js','Skills required')}${fld('jn','Referral slots','number')}</div><button class="btn" onclick="postJ()">Post job</button></section>`:''}
<section class="panel"><h3>Open jobs</h3>${j.map(x=>`<div class="item">${av(x.company)}<div class="grow"><b>${esc(x.title)}</b><span class="m">${esc(x.company)} · posted by ${esc(x.poster)}</span></div>${pill(x.slots-x.used+' of '+x.slots+' slots')}${U.role==='student'?`<button class="btn s" onclick="jr(${x.id})">Request referral</button>`:''}</div>`).join('')||empty('No jobs posted yet.')}</section>
<section class="panel"><h3>Referral tracker</h3>${r.map(x=>`<div class="item">${av(x.student)}<div class="grow"><b>${esc(x.student)}</b><span class="m">${esc(x.title)} at ${esc(x.company)}</span></div>${pill(x.status)}${U.role==='alumni'&&x.posterId===U.id?`<select style="width:auto" onchange="rs(${x.id},this.value)">${S.map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select>`:''}</div>`).join('')||empty('Nothing tracked yet.')}</section>`)}
const postJ=()=>api('/jobs','POST',{title:val('jt'),company:val('jc'),skills:val('js'),slots:val('jn')}).then(referrals),jr=id=>api(`/jobs/${id}/request`,'POST').then(referrals).catch(()=>0),rs=(id,s)=>api('/referrals/'+id,'POST',{status:s}).then(referrals);
async function library(){const q=window._q||'',e=await api('/exp?q='+encodeURIComponent(q));
 put(`<section class="panel"><div class="bar2">${fld('sq','Search by company or role','text','e.g. Google')}<button class="btn" style="margin-bottom:10px" onclick="window._q=val('sq');library()">Search</button></div></section>
${U.role==='alumni'?`<section class="panel"><h3>Share your interview experience</h3><div class="g2">${fld('ec','Company')}${fld('er','Role')}</div><label class="f"><span>Rounds and questions</span><textarea id="ero" rows="3"></textarea></label><label class="f"><span>Tips</span><textarea id="et" rows="2"></textarea></label><button class="btn" onclick="api('/exp','POST',{company:val('ec'),role:val('er'),rounds:val('ero'),tips:val('et')}).then(library)">Share</button></section>`:''}
${e.map(x=>`<section class="panel"><div class="item" style="padding:0;border:0">${av(x.company)}<div class="grow"><b>${esc(x.company)} · ${esc(x.role)}</b><span class="m">by ${esc(x.author)}, batch ${x.batch}</span></div></div><p style="white-space:pre-wrap">${esc(x.rounds)}</p><div class="tip">Tip: ${esc(x.tips)}</div></section>`).join('')||empty('No experiences yet.')}`);$('#sq').value=q}
async function paths(){const p=await api('/paths'),mx=Math.max(1,...p.map(x=>x.n)),by={};p.forEach(x=>(by[x.branch||'Other']??=[]).push(x));
 put(Object.entries(by).map(([b,l])=>`<section class="panel"><h3>${esc(b)}</h3>${l.map(x=>`<div style="display:flex;justify-content:space-between"><span>${esc(x.company)}</span><b>${x.n}</b></div><div class="bar" style="width:${100*x.n/mx}%"></div>`).join('')}</section>`).join('')||empty('No data yet. Alumni profiles with a company appear here.'))}
async function events(){const e=await api('/events');put(e.map(x=>{const d=new Date(x.date),ok=!isNaN(d);return`<section class="panel"><div class="item" style="padding:0;border:0"><div class="date"><b>${ok?d.getDate():'–'}</b><span>${ok?d.toLocaleString('en',{month:'short'}):''}</span></div><div class="grow"><b>${esc(x.title)}</b><span class="m">Batch: ${esc(x.batch)} · ${x.going} going · ${x.attended} checked in</span></div>${x.code?`<span class="code">${x.code}</span>`:`<button class="btn s" onclick="api('/events/${x.id}/rsvp','POST').then(events)">RSVP</button>`}</div></section>`}).join('')||empty('No events scheduled yet.'))}
let ct,cn='';async function chat(){const p=await api('/chat/people');put(`<section class="panel"><h3>Conversations</h3>${p.map(x=>`<button class="btn s g" style="margin:0 6px 6px 0" onclick="openC(${x.id},'${esc(x.name)}')">${esc(x.name)}</button>`).join('')||empty('Chat opens once a mentor accepts a request.')}<div id="cw"></div></section>`)}
function openC(id,n){clearInterval(ct);if(n)cn=n;$('#cw').innerHTML=`<h3 style="margin-top:14px">${esc(cn)}</h3><div class="chat" id="cl"></div><div class="bar2">${fld('cm','','text','Type a message')}<button class="btn" style="margin-bottom:10px" onclick="send(${id})">Send</button></div>`;
 const ld=async()=>{const m=await api('/chat/'+id);if(!$('#cl')){clearInterval(ct);return}$('#cl').innerHTML=m.map(x=>`<div class="bub ${x.a===U.id?'me2':''}">${esc(x.body)}</div>`).join('');$('#cl').scrollTop=1e6};ld();ct=setInterval(ld,3000)}
const send=id=>api('/chat/'+id,'POST',{body:val('cm')}).then(()=>openC(id));
async function giving(){const g=await api('/gifts'),mx=Math.max(1,...g.funds.map(f=>f.total));put(`<section class="hero2"><div><p class="m">Raised by the community</p><h2>₹${g.total}</h2></div></section><div class="cols"><section class="panel"><h3>Funds</h3>${g.funds.map(f=>`<div style="display:flex;justify-content:space-between"><span>${esc(f.fund)}</span><span class="m">₹${f.total} · ${f.donors} donors</span></div><div class="bar" style="width:${100*f.total/mx}%"></div>`).join('')||empty('No gifts yet. Start the first fund.')}</section>
<section class="panel"><h3>Contribute</h3><label class="f"><span>Fund</span><select id="gf"><option>Scholarship fund</option><option>Lab and equipment</option><option>Emergency student aid</option></select></label>${fld('ga','Amount (₹)','number')}<button class="btn" onclick="api('/gifts','POST',{fund:val('gf'),amount:val('ga')}).then(giving)">Give</button><p class="m">Demo mode: no real payment is taken.</p></section></div>`)}
async function resume(){const a=await api('/resume/analyze');put(`<div class="cols"><section class="panel"><h3>Your resume</h3><label class="f"><span>Paste your resume text</span><textarea id="rt2" rows="11"></textarea></label><button class="btn" onclick="api('/resume','PUT',{text:val('rt2')}).then(resume)">Save and analyze</button></section>
<div><section class="panel"><h3>Feedback</h3>${a.tips.map(t=>`<div class="tip" style="margin:0 0 8px">${esc(t)}</div>`).join('')||'<p>Looks solid.</p>'}</section>
<section class="panel"><h3>Job match</h3>${a.jobs.map(j=>`<div class="item"><div class="grow"><b>${esc(j.title)}</b><span class="m">${esc(j.company)}${j.missing.length?' · missing: '+esc(j.missing.join(', ')):''}</span></div>${pill(j.match+'%')}</div>`).join('')||empty('No jobs to match yet.')}</section></div></div>`)}
async function admin(){const s=await api('/admin/stats'),p=await api('/admin/pending');
 put(`<div class="stats"><div class="stat"><b>${s.alumni}</b>alumni</div><div class="stat"><b>${s.students}</b>students</div><div class="stat"><b>${s.alumni?Math.round(100*s.employed/s.alumni):0}%</b>employed</div><div class="stat"><b>${s.mentorships}</b>active mentorships</div></div>
<section class="panel"><h3>Outcomes by branch</h3>${s.byBranch.map(b=>`<div class="item"><b class="grow">${esc(b.branch||'N/A')}</b><span class="m">${b.total} alumni</span>${pill(b.employed+' employed')}</div>`).join('')||empty('No alumni yet.')}<button class="btn g" style="margin-top:12px" onclick="dl()">Download accreditation report (CSV)</button></section>
<div class="cols"><section class="panel"><h3>Top employers</h3>${s.recruiters.map(x=>`<div class="item"><span class="grow">${esc(x.company)}</span><b>${x.n}</b></div>`).join('')||empty('None yet.')}</section><section class="panel"><h3>Top cities</h3>${s.cities.map(x=>`<div class="item"><span class="grow">${esc(x.city)}</span><b>${x.n}</b></div>`).join('')||empty('None yet.')}</section></div>
<section class="panel"><h3>Pending approvals</h3>${p.map(x=>`<div class="item">${av(x.name)}<div class="grow"><b>${esc(x.name)}</b><span class="m">${esc(x.email)} · ${x.role}</span></div><button class="btn s" onclick="api('/admin/approve/${x.id}','POST').then(admin)">Approve</button></div>`).join('')||empty('No one is waiting.')}</section>
<div class="cols"><section class="panel"><h3>Create event</h3>${fld('et2','Title')}<div class="g2">${fld('ed','Date','date')}${fld('eb','Batch (or All)')}</div><button class="btn" onclick="api('/events','POST',{title:val('et2'),date:val('ed'),batch:val('eb')})">Create event</button></section>
<section class="panel"><h3>Check-in</h3>${fld('cc','Attendee code')}<button class="btn" onclick="api('/checkin','POST',{code:val('cc')})">Check in</button></section></div>`)}
async function dl(){const r=await fetch('/api/admin/report.csv',{headers:{Authorization:'Bearer '+T}}),a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download='outcomes_report.csv';a.click()}
boot();
</script></body></html>
